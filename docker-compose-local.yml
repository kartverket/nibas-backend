version: "3.9"
services:
  vault:
    image: vault
    ports:
      - "8200:1234"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=myroot
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:1234
    volumes:
      - db_volume:/var/lib/postgresql
  database:
    image: postgis/postgis
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=nibas
      - POSTGRES_PASSWORD=nibas
      - TZ=Europe/Oslo
      - PGTZ=Europe/Oslo
volumes:
  db_volume: {}

