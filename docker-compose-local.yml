version: "3.9"
services:
  vault:
    image: vault
    ports:
      - "8200:1234"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=myroot
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:1234
    volumes:
      - db_volume:/var/lib/postgresql
  database:
    image: ghcr.io/kartverket/nibas-db:v0.0.1
    ports:
      - "5432:5432"
    environment:
      - NIBAS_USER_PW=nibas
      - POSTGRES_PASSWORD=nibas
      - POSTGRES_DB=nibas
volumes:
  db_volume: {}

