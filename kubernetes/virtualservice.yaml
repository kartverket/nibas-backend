apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: nibas-backend
  namespace: nibas
spec:
  hosts:
  - nibas-backend.nibas.svc.cluster.local
  - "nibas-api.dev.skip.statkart.no"
  gateways:
  - nibas-backend
  http:
  - match:
      - port: 80
    route:
    - destination:
        host: nibas-backend
        port: 
          number: 80