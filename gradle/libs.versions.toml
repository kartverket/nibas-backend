[versions]
flywayVersion = "11.20.2"
jtsVersion = "1.20.0"
kotlinMockitoVersion = "6.2.1"
kotlinPluginVersion = "2.3.10"
kotlinxCoroutinesCoreVersion = "1.10.2"
logstashVersion = "9.0"
matrikkelVersion = "4.25.0.0"
nimbusJwtVersion = "10.7"
openTelemetryVersion = "1.58.0"
orgApacheCfxVersion = "4.1.4"
prometheusVersion = "1.16.2"
spatial4jVersion = "0.8"
springDependencyManagementVersion = "1.1.7"
springFrameworkVersion = "3.5.12"
springdocOpenapiVersion2 = "2.8.15"
springmockkVersion = "5.0.1"
testContainerVersion = "1.21.4"
proj4jVersion = "1.4.1"
proj4jEPSGVersion = "1.4.1"

[libraries]
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flywayVersion" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flywayVersion" }
h2-db = { module = "com.h2database:h2" }
hibernate-spatial = { module = "org.hibernate.orm:hibernate-spatial" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
kotlin-mockito = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "kotlinMockitoVersion" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCoreVersion" }
locationtech-jts = { module = "org.locationtech.jts:jts", version.ref = "jtsVersion" }
locationtech-jts-core = { module = "org.locationtech.jts:jts-core", version.ref = "jtsVersion" }
locationtech-jts-io = { module = "org.locationtech.jts:jts-io", version.ref = "jtsVersion" }
locationtech-jts-io-common = { module = "org.locationtech.jts.io:jts-io-common", version.ref = "jtsVersion" }
locationtech-jts-modules = { module = "org.locationtech.jts:jts-modules", version.ref = "jtsVersion" }
locationtech-spatial4j = { module = "org.locationtech.spatial4j:spatial4j", version.ref = "spatial4jVersion" }
locationtech-proj4j = {module = "org.locationtech.proj4j:proj4j", version.ref = "proj4jVersion"}
locationtech-proj4j-epsg = { module = "org.locationtech.proj4j:proj4j-epsg", version.ref = "proj4jEPSGVersion" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashVersion" }
matrikkelapi-wsclient = { module = "no.kartverket.matrikkelapi-v1:matrikkelapi-v1-wsclient", version.ref = "matrikkelVersion" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "prometheusVersion" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusJwtVersion" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "openTelemetryVersion" }
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "openTelemetryVersion" }
org-apache-cxf-frontend ={ module = "org.apache.cxf:cxf-rt-frontend-jaxws", version.ref = "orgApacheCfxVersion" }
org-apache-cxf-transports ={ module = "org.apache.cxf:cxf-rt-transports-http", version.ref = "orgApacheCfxVersion" }
postgres = { module = "org.postgresql:postgresql" }
spring-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-batch-test = { module = "org.springframework.batch:spring-batch-test" }
spring-integration-core = { module = "org.springframework.integration:spring-integration-core" }
spring-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-mockk = { module = "com.ninja-squad:springmockk", version.ref = "springmockkVersion" }
spring-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-validator = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
springdoc-openapi-common = { module = "org.springdoc:springdoc-openapi-starter-common", version.ref = "springdocOpenapiVersion2" }
springdoc-openapi-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdocOpenapiVersion2" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdocOpenapiVersion2" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testContainerVersion" }
testcontainers-postgres = { module = "org.testcontainers:postgresql", version.ref = "testContainerVersion" }

[plugins]
flyway = { id = "org.flywaydb.flyway", version.ref = "flywayVersion" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlinPluginVersion" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlinPluginVersion" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlinPluginVersion" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlinPluginVersion" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagementVersion" }
spring-framework = { id = "org.springframework.boot", version.ref = "springFrameworkVersion" }
