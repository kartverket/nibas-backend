spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: notarealurl
    username: notarealuser
    password: notarealpassword
  jpa:
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisDialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  cloud:
    vault:
      enabled: false
  # Må også inn i test-konfigen ellers feiler GrenseControllerTest.
  jackson:
    time-zone: "Europe/Oslo"

# Hver dag kl 03
nibas:
  cron:
    kodeliste:
      invalidate: 0 0 3 * * *
