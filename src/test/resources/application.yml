spring:
  datasource:
    driver-class-name: org.h2.Driver
    username: nibas
    password: nibas
    url: jdbc:h2:mem:nibas;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS NIBAS\;SET SCHEMA NIBAS
  jpa:
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisDialect
    hibernate:
      # For at H2-basen skal opprettes med tabeller i skjemaet
      ddl-auto: update
  flyway:
    enabled: false
  cloud:
    vault:
      enabled: false
  # Må også inn i test-konfigen ellers feiler GrenseControllerTest.
  jackson:
    time-zone: "Europe/Oslo"
# Hver dag kl 03
nibas:
  cron:
    kodeliste:
      invalidate: 0 0 3 * * *
