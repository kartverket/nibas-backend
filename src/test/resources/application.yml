spring:
  datasource:
    driver-class-name: org.h2.Driver
    username: nibas
    password: nibas
    url: jdbc:h2:mem:nibas;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS NIBAS\;SET SCHEMA NIBAS
  flyway:
    enabled: false
  cloud:
    vault:
      enabled: false
    gcp:
      pubsub:
        enabled: false
      core:
        enabled: false
  # Må også inn i test-konfigen ellers feiler GrenseControllerTest.
  jackson:
    time-zone: "Europe/Oslo"
# Hver dag kl 03
nibas:
  idporten:
    url: https://dummy.url.idporten
  cron:
    kodeliste:
      invalidate: 0 0 3 * * *
