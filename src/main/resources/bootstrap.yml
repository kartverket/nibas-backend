spring:
  profiles:
    active: prod
  application:
    name: nibas-server-api
  cloud:
    vault:
      config:
        lifecycle:
          enabled: true
      uri: https://vault.statkart.no
      ssl:
        trust-store: classpath:ca.jks
        trust-store-type: jks
        trust-store-password: changeit
      connection-timeout: 5000
      read-timeout: 15000
      kv:
        backend: nibas
---
spring:
  config:
    activate:
      on-profile: test
  cloud:
    vault:
      authentication: kubernetes
      kubernetes:
        role: nibas-server-api
        kubernetes-path: kubernetes-tz2-test-apps
        service-account-token-file: /var/run/secrets/kubernetes.io/serviceaccount/token
---
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    vault:
      authentication: token
      token: ${VAULT_TOKEN}

