management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: '*'
  endpoint:
    info:
      enabled: true
    health:
      enabled: true
  info:
    env:
      enabled: true

info:
  application:
    version: ${PROJECT_VERSION}

springdoc:
  api-docs:
    path: /api-docs

spring:
  profiles:
    active: prod

  main:
    banner-mode: "OFF"

  autoconfigure:
    exclude:
      # Disables the default in-memory-user-authentication. Se Jira: https://kartverket.atlassian.net/browse/TS-535
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  application:
    name: nibas-backend

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisDialect
    # Øker ytelsen ved import betraktelig dersom den settes til false, men resten av applikasjonen håndterer det per nå ikke. Se også https://stackoverflow.com/questions/30549489/what-is-this-spring-jpa-open-in-view-true-property-in-spring-boot
    # open-in-view: false
    # Dersom man vil vises hibernate-spørringene i loggen
    # show-sql: true
      # properties:
      # hibernate:
    # format_sql: true

  jackson:
    time-zone: "Europe/Oslo"

  flyway:
    schemas: nibas


  # Vault-konfigurasjon
  cloud:
    vault:
      uri: https://vault.vault:8200
      authentication: kubernetes
      kubernetes:
        role: nibas # Er en rolle definert hos skip
        kubernetes-path: ${KUBERNETES_CLUSTER}
        service-account-token-file: /var/run/secrets/kubernetes.io/serviceaccount/token
      ssl:
        trust-store: classpath:ca.jks
        trust-store-type: jks
        trust-store-password: changeit
      connection-timeout: 5000
      read-timeout: 15000
  config:
    import: vault://nibas/nibas-backend, vault://nibas/nibas-db

  jmx:
    enabled: true

  kafka:
    bootstrap-servers: nibas-kafka:9092
    producer:
      properties:
        spring:
          json:
            add:
              type:
                headers: false
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Hver dag kl 03
nibas:
  cron:
    kodeliste:
      invalidate: 0 0 3 * * *
---
spring:
  config:
    activate:
      on-profile: localhost
    import: vault://nibas/nibas-backend-local, vault://nibas/nibas-db-local
  main:
    banner-mode: "CONSOLE"
  cloud:
    vault:
      uri: ${VAULT_ADDR:https://vault.dev.skip.statkart.no/}
      authentication: token
      token: ${VAULT_TOKEN:myroot}
      enabled: true
  kafka:
    bootstrap-servers: localhost:29092
  datasource:
    url: ${DB_CONNECTION_STRING:jdbc:postgresql://localhost:5432/nibas}
    username: ${DB_USER:nibas}
    password: ${DB_PASSWORD:nibas}

nibas:
  kafka:
    enabled: false

