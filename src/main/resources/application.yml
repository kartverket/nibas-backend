spring:
  profiles:
    group:
      localhost:
        - "humanReadableLog"
        - "eventsDisabled"
      dev:
        - "security-off"

  main:
    banner-mode: "OFF"

  autoconfigure:
    exclude:
      # Disables the default in-memory-user-authentication. Se Jira: https://kartverket.atlassian.net/browse/TS-535
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  application:
    name: nibas-backend

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        ddl-auto: none
        max_fetch_depth: 6
        cache:
          query_cache_layout: FULL
        integration:
          envers:
            enabled: false
        jdbc:
          time_zone: "Europe/Oslo"

  jackson:
    time-zone: "Europe/Oslo"

  flyway:
    schemas: nibas
    validateMigrationNaming: true

  jmx:
    enabled: true

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: 'health, prometheus'
    jmx:
      exposure:
        include: '*'
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      access: unrestricted
  info:
    env:
      enabled: true

info:
  application:
    version: ${PROJECT_VERSION}

springdoc:
  api-docs:
    path: /api-docs

---
# Profile-specific: localhost
spring:
  config:
    activate:
      on-profile: localhost
  datasource:
    url: jdbc:postgresql://localhost:5432/nibas
    username: nibas
    password: nibas

nibas:
  authorized:
    users: bd23d991ffd8b950373470ed4b27e965
  idporten:
    url: https://test.idporten.no
