management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: '*'
  endpoint:
    info:
      enabled: true
    health:
      enabled: true

info:
  app:
    version: ${PROJECT_VERSION}

springdoc:
  api-docs:
    path: /api-docs

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    # Dersom du vil kjøre uten oppslag mot Vault
#    username: nibas
#    password: nibas123
#    url: jdbc:postgresql://localhost:5432/nibas
  jpa:
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisDialect
    hibernate:
      ddl-auto: update
    #Dersom man vil vises hibernate-spørringene i loggen
#    show-sql: true
#    properties:
#      hibernate:
#        format_sql: true
  flyway:
    schemas: nibas
  #TODO: Remove when proper s3-integration is ready
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 128MB

# Hver dag kl 03
nibas:
  cron:
    kodeliste:
      invalidate: 0 0 3 * * *
