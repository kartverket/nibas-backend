management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: '*'
  endpoint:
    info:
      enabled: true
    health:
      enabled: true
  info:
    env:
      enabled: true

info:
  application:
    version: ${PROJECT_VERSION}

springdoc:
  api-docs:
    path: /api-docs

spring:
  profiles:
    active: prod

  application:
    name: nibas-backend

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisDialect
    hibernate:
      ddl-auto: update
    # Øker ytelsen ved import betraktelig dersom den settes til false, men resten av applikasjonen håndterer det per nå ikke. Se også https://stackoverflow.com/questions/30549489/what-is-this-spring-jpa-open-in-view-true-property-in-spring-boot
    open-in-view: false
    #Dersom man vil vises hibernate-spørringene i loggen
  #    show-sql: true
#    properties:
#      hibernate:
#        format_sql: true

  jackson:
    time-zone: "Europe/Oslo"

  flyway:
    schemas: nibas

  #TODO: Remove when proper s3-integration is ready
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 128MB

  # Vault-konfigurasjon
  cloud:
    vault:
      ssl:
        trust-store: classpath:ca.jks
        trust-store-type: jks
        trust-store-password: changeit
      connection-timeout: 5000
      read-timeout: 15000
  config:
    import: vault://nibas/nibas-backend, vault://nibas/nibas-db

  jmx:
    enabled: true

# Hver dag kl 03
nibas:
  cron:
    kodeliste:
      invalidate: 0 0 3 * * *
---
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    vault:
      uri: https://vault.dev.skip.statkart.no/
      authentication: kubernetes
      kubernetes:
        role: nibas # Er en rolle definert hos skip
        kubernetes-path: atkv1-dev
        service-account-token-file: /var/run/secrets/kubernetes.io/serviceaccount/token
---
spring:
  config:
    activate:
      on-profile: localhost
    import: vault://nibas/nibas-backend-local, vault://nibas/nibas-db-local
  cloud:
    vault:
      uri: https://vault.dev.skip.statkart.no/
      authentication: token
      token: ${VAULT_TOKEN}
      enabled: true

