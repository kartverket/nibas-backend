management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: 'health, prometheus'
    jmx:
      exposure:
        include: '*'
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true

info:
  application:
    version: ${PROJECT_VERSION}

springdoc:
  api-docs:
    path: /api-docs

spring:
  profiles:
    active: prod
    group:
      localhost:
        - "humanReadableLog"
        - "eventsDisabled"
  main:
    banner-mode: "OFF"

  autoconfigure:
    exclude:
      # Disables the default in-memory-user-authentication. Se Jira: https://kartverket.atlassian.net/browse/TS-535
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  application:
    name: nibas-backend

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    # Dersom man vil vises hibernate-spørringene i loggen
    # show-sql: true
      # properties:
      # hibernate:
    # format_sql: true
    properties:
      hibernate:
        integration:
          envers:
            enabled: false
        jdbc:
          time_zone: "Europe/Oslo"

  jackson:
    time-zone: "Europe/Oslo"

  flyway:
    schemas: nibas
    validateMigrationNaming: true

  jmx:
    enabled: true

# Hver dag kl 03
nibas:
  idporten:
    url: https://idporten.no
  cron:
    kodeliste:
      invalidate: 0 0 3 * * *
