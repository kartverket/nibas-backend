management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: 'health, prometheus'
    jmx:
      exposure:
        include: '*'
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true
  health:
    vault:
      enabled: false

info:
  application:
    version: ${PROJECT_VERSION}

springdoc:
  api-docs:
    path: /api-docs

aut.host.url: http://aut-idporten.aut-main:8080

spring:
  profiles:
    active: prod
    group:
      localhost:
        - "humanReadableLog"
        - "eventsDisabled"
  main:
    banner-mode: "OFF"

  autoconfigure:
    exclude:
      # Disables the default in-memory-user-authentication. Se Jira: https://kartverket.atlassian.net/browse/TS-535
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  application:
    name: nibas-backend

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    # Dersom man vil vises hibernate-spørringene i loggen
    # show-sql: true
      # properties:
      # hibernate:
    # format_sql: true
    properties:
      hibernate:
        integration:
          envers:
            enabled: false
        jdbc:
          time_zone: "Europe/Oslo"

  jackson:
    time-zone: "Europe/Oslo"

  flyway:
    schemas: nibas
    validateMigrationNaming: true

  # Vault-konfigurasjon
  cloud:
    vault:
      uri: https://vault.vault:8200
      authentication: kubernetes
      kubernetes:
        role: nibas # Er en rolle definert hos skip
        kubernetes-path: ${KUBERNETES_CLUSTER}
        service-account-token-file: /var/run/secrets/kubernetes.io/serviceaccount/token
      ssl:
        trust-store: classpath:ca.jks
        trust-store-type: jks
        trust-store-password: changeit
      connection-timeout: 5000
      read-timeout: 15000
  config:
    import:
      vault://nibas/nibas-backend,
      vault://nibas/nibas-db,
      vault://nibas/nibas-backend-apikeys,
      vault://nibas/nibas-events-apikeys,

  jmx:
    enabled: true

# Hver dag kl 03
nibas:
  cron:
    kodeliste:
      invalidate: 0 0 3 * * *
---
spring:
  config:
    activate:
      on-profile: localhost
  datasource:
    url: ${DB_CONNECTION_STRING:jdbc:postgresql://localhost:5432/nibas}
    username: ${DB_USER:nibas}
    password: ${DB_PASSWORD:nibas}
  cloud:
    vault:
      uri: ${VAULT_ADDR:https://vault.dev.skip.statkart.no/}
      authentication: token
      token: ${VAULT_TOKEN:myroot}
      enabled: true

aut.host.url: https://aut-idporten.dev.skip.statkart.no

