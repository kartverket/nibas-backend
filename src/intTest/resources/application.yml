spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisDialect
    hibernate:
      ddl-auto: update
  flyway:
    schemas: nibas
  cloud:
    vault:
      enabled: false
#   Må også inn i test-konfigen ellers feiler GrenseControllerTest.
  jackson:
    time-zone: "Europe/Oslo"

# Hver dag kl 03
nibas:
  cron:
    kodeliste:
      invalidate: 0 0 3 * * *
