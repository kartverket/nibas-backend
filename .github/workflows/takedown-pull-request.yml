name: Takedown PR
on:
  workflow_dispatch:
    inputs:
      branch-name:
        description: "Name of the feature environment to be deleted."
        required: true
  pull_request:
    types:
      - closed

jobs:
  should-takedown-feature-env:
    if: ${{ github.event_name == 'pull_request' }}
    uses: kartverket/nibas-backend/.github/workflows/check-changes.yml@main
    with:
      ignore-paths: "README.md,.github/,.vscode/,.security/"

  determine-branch-name-pr:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.should-takedown-feature-env.outputs.has-relevant-changes == 'true' }}
    needs: [should-takedown-feature-env]
    name: Determine Branch Name (PR)
    runs-on: ubuntu-latest
    outputs:
      BRANCH_NAME: ${{ steps.determine-branch.outputs.branch_name_output }}
    steps:
      - name: Determine branch name
        id: determine-branch
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          BRANCH_NAME=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]')
          echo "branch_name_output=$BRANCH_NAME" >> $GITHUB_OUTPUT

  determine-branch-name-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Determine Branch Name (Manual)
    runs-on: ubuntu-latest
    outputs:
      BRANCH_NAME: ${{ steps.determine-branch.outputs.branch_name_output }}
    steps:
      - name: Determine branch name
        id: determine-branch
        run: |
          BRANCH_NAME="${{ inputs.branch-name }}"
          BRANCH_NAME=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]')
          echo "branch_name_output=$BRANCH_NAME" >> $GITHUB_OUTPUT

  takedown-pull-request:
    needs: [determine-branch-name-pr]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.should-takedown-feature-env.outputs.has-relevant-changes == 'true' }}
    permissions:
      id-token: write
    uses: kartverket/smia-apps/.github/workflows/delete-feature-branch.yml@main
    with:
      branch-name: ${{ needs.determine-branch-name-pr.outputs.BRANCH_NAME }}
      identity: nibas

  takedown-manual:
    needs: [determine-branch-name-manual]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write
    uses: kartverket/smia-apps/.github/workflows/delete-feature-branch.yml@main
    with:
      branch-name: ${{ needs.determine-branch-name-manual.outputs.BRANCH_NAME }}
      identity: nibas
