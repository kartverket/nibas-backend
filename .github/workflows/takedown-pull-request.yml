name: Takedown PR
on:
  workflow_dispatch:
    inputs:
      branch-name:
        description: "Name of the feature environment to be deleted."
        required: true
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  determine-branch-name:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    name: Determine Branch Name
    runs-on: ubuntu-latest
    outputs:
      BRANCH_NAME: ${{ steps.determine-branch.outputs.branch_name_output }}
    steps:
      - name: Determine branch name
        id: determine-branch
        env:
          INPUT_BRANCH_NAME: ${{ inputs.branch-name }}
          PR_BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$INPUT_BRANCH_NAME" != "" ]; then
            BRANCH_NAME="$INPUT_BRANCH_NAME"
          else
            BRANCH_NAME="$PR_BRANCH_NAME"
          fi
          BRANCH_NAME=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]')
          if [[ ! "$BRANCH_NAME" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "Branch name is not a valid hostname label"
            exit 1
          fi
          echo "branch_name_output=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

  takedown-pull-request:
    needs: [determine-branch-name]
    permissions:
      id-token: write
      contents: read
    uses: kartverket/smia-apps/.github/workflows/delete-feature-branch.yml@be0f98aa389ba65196fc838e34b8eba98fd36f8f # main
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
    with:
      branch-name: ${{ needs.determine-branch-name.outputs.BRANCH_NAME }}
      identity: nibas
