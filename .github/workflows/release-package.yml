name: Release app
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
      packages: write
      checks: write
      pull-requests: write
    uses: $/.github/workflows/build-app.yml
    with:
      deploy_ghcr: true
    secrets:
      SHARED_PACKAGES_READ_TOKEN: ${{ secrets.SHARED_PACKAGES_READ_TOKEN }}

  pharos:
    name: Run Pharos security scan
    needs: build
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: "Run Pharos"
        uses: kartverket/pharos@446d11f033ffe30b4c91f885c3ad34ea3d8c6af7 # v0.7.0
        with:
          allow_severity_level: critical
          image_url: ${{ needs.build.outputs.image_url }}

  deploy-dev:
    permissions:
      id-token: write
      contents: read
    needs: [pharos, build]
    strategy:
      fail-fast: false
      matrix:
        namespace: [nibas-main, nibas-e2e]
    uses: kartverket/smia-workflows/.github/workflows/deploy-app.yml@main
    with:
      application: nibas-backend
      version: ${{ needs.build.outputs.version }}
      digest: ${{ needs.build.outputs.digest }}
      environment: dev
      namespace: ${{ matrix.namespace }}
      identity: nibas

  deploy-prod:
    permissions:
      id-token: write
      contents: read
    needs: [build, deploy-dev]
    uses: kartverket/smia-workflows/.github/workflows/deploy-app.yml@main
    with:
      application: nibas-backend
      version: ${{ needs.build.outputs.version }}
      digest: ${{ needs.build.outputs.digest }}
      environment: prod
      namespace: nibas-main
      identity: nibas
