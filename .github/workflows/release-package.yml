name: nibas-backend
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: [tanzu, linux]

    steps:
    - uses: actions/checkout@v2
      # Fetch environment variables and set for subsequent steps
    - name: read .env
      run: cat .github/workflows/.env | sed '/^#/d' | tee -a ${GITHUB_ENV}
    - name: Set up JDK
      uses: actions/setup-java@v2
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build --info