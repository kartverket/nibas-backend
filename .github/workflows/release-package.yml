name: nibas-backend
on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  image_name: nibas-backend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read

    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}

    steps:
      - uses: szenius/set-timezone@v1.0
        with:
          timezoneLinux: "Europe/Oslo"
      - uses: actions/checkout@v2
      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build --info
        env:
          GH_USERNAME: ${{ secrets.PAT_USERNAME }}
          PAT: ${{ secrets.PAT_SCOPE_READ_PACKAGE }}


      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.0
        with:
          github_token: ${{ github.token }}

      - name: Login to Github Container Registry
        uses: docker/login-action@v1
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password:  ${{ github.token }}

      - name: Build docker and push
        id: build
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ env.registry }}/${{ github.repository }}:${{ steps.tag_version.outputs.new_tag }} , ${{ env.registry }}/${{ github.repository }}:latest
          build-args: |
            project_version_arg=${{ steps.tag_version.outputs.new_tag }}

      - name: Run Trivy vulnerability scanner
        id: securityscan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.registry }}/${{ github.repository }}:${{ steps.tag_version.outputs.new_tag }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v1
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-dev:
    needs: build
    name: Deploy to dev
    permissions:
      id-token: write
      contents: 'read'
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      matrix:
        environment: [ 'atkv1-dev' ]

    steps:
    - name: Checkout
      uses: actions/checkout@v2

    # Fetch environment variables and set for subsequent steps
    - name: read .env
      uses: c-py/action-dotenv-to-setenv@v3
      with: 
        env-file: .github/workflows/.env.${{matrix.environment}}
      
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v0

    # Authenticate with google cloud serviceaccount to have permissions in cluster.
    # Variabel project_id må settes til kubernetesprosjektet her.   
    - id: auth
      name: Authenticate to GCP
      uses: google-github-actions/auth@v0
      with:
        workload_identity_provider: ${{env.WORKLOAD_IDENTITY_FEDERATION_PROVIDER}}
        service_account: ${{env.WORKLOAD_IDENTITY_FEDERATION_SERVICE_ACCOUNT}}
        project_id: ${{env.TF_VAR_PROJECT_ID}}

    - name: Authenticate with cluster
      run: gcloud container hub memberships get-credentials ${{ matrix.environment }} --verbosity debug
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v1
      with:
        terraform_wrapper: false

    - name: Generate terraform variables
      run: |
        cat <<EOF >> terraform.tfvars
        nibas_backend_version="${{ needs.build.outputs.new_tag }}"
        EOF
    
    - name: Generate terraform backend variables
      run: |
        cat <<EOF >> backend.tfbackend
        bucket="${{ env.BUCKET }}"
        EOF
    
    - name: Terraform init
      run: terraform init -input=false -backend-config=backend.tfbackend

    - name: Terraform plan
      run: terraform plan -input=false

    - name: Terraform apply
      run: terraform apply -input=false -auto-approve          

  deploy-test:
    needs: build
    name: Deploy to test
    permissions:
      id-token: write
      pull-requests: write
      contents: read
    uses: kartverket/github-workflows/.github/workflows/run-terraform.yml@v2.7.3
    with:
      runner: atkv1-test
      environment: test
      kubernetes_cluster: atkv1-test
      terraform_workspace: test
      terraform_options: -var-file=test.tfvars -var=image=ghcr.io/kartverket/nibas-backend:${{ needs.build.outputs.new_tag }}
      terraform_backend_config: -backend-config=test.gcs.tfbackend
      working_directory: terraform
      workload_identity_provider: projects/935702487708/locations/global/workloadIdentityPools/nibas-deploy-pool/providers/github-provider
      service_account: nibas-deploy@nibas-test-36cb.iam.gserviceaccount.com
      project_id: kubernetes-test-94f6
      #image_url: <registry>/<repository>:<tag> or <registry>/<repository>@<digest> - trenger dette ved attestering av images, som vi må ha i prod
