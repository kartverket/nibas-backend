name: nibas-backend
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  image_name: nibas-backend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:

    # Vi har kanskje lyst til å kjøre på ubuntu-latest, men det feilet med permissions når diverse kataloger skulle opprettes
    runs-on: linux
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}

    steps:
      - uses: actions/checkout@v2
      # Fetch environment variables and set for subsequent steps
      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build --info
      
      - name: Bump version and push tag
        id: tag_version
        #TODO: Sjekke ut om vi kan bumpe opp til 6.0. nibas-db kjører på 6.0 med runs-on: ubuntu-latest. Men her feila det med ubuntu-latest
        uses: mathieudutour/github-tag-action@v5.3
        with:
          github_token: ${{ github.token }}

      - name: Login to Github Container Registry
        uses: docker/login-action@v1
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password:  ${{ github.token }}

      - name: Build docker and push
        id: build
        uses: whoan/docker-build-with-cache-action@v5
        with:
          context: .
          username: ${{ github.actor }}
          password: ${{ github.token }}
          registry: ${{ env.registry }}
          image_tag: ${{ steps.tag_version.outputs.new_tag }}
          image_name: ${{ github.repository }}
          build_extra_args: '{"--build-arg": "project_version_arg=${{ steps.tag_version.outputs.new_tag }}"}'

  deploy:
    needs: build
    runs-on: linux
    environment: atkv2-test-apps
    
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Authenticate with Google Cloud
      uses: google-github-actions/auth@v0
      with: 
        credentials_json: ${{ secrets.SERVICE_ACCOUNT_JSON }}

    - name: Authenticate with cluster
      run: gcloud container hub memberships get-credentials atkv2-test-apps --verbosity debug

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v1

    - name: Generate terraform variables
      run: |
        cat <<EOF >> terraform.tfvars
        nibas_backend_version="${{ needs.build.outputs.new_tag }}"
        EOF
    
    - name: Terraform init
      run: terraform init -input=false

    - name: Terraform plan
      run: terraform plan -input=false

    - name: Terraform apply
      run: terraform apply -input=false -auto-approve          