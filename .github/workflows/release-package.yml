name: Release app
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  image_name: nibas-backend
  registry: ghcr.io
  registry_path: kartverket

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
      packages: write
      checks: write
      pull-requests: write
    uses: ./.github/workflows/build-app.yml
    with:
      deploy_ghcr: true
    secrets:
      SHARED_PACKAGES_READ_TOKEN: ${{ secrets.SHARED_PACKAGES_READ_TOKEN }}

  pharos:
    name: Run Pharos security scan
    needs: build
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: "Run Pharos"
        uses: kartverket/pharos@446d11f033ffe30b4c91f885c3ad34ea3d8c6af7 # v0.7.0
        with:
          allow_severity_level: critical
          image_url: ${{ needs.build.outputs.image_url }}

  deploy-argo:
    permissions:
      id-token: write
      contents: read
    needs: [pharos, build]
    uses: kartverket/smia-apps/.github/workflows/release-app-octo-sts.yml@be0f98aa389ba65196fc838e34b8eba98fd36f8f # main
    with:
      application: nibas-backend
      version: ${{ needs.build.outputs.version }}
      deploy_dev: true
      deploy_prod: true
      extra_namespace: nibas-e2e
      identity: nibas
      
  run-cypress:
    permissions:
      id-token: write
      contents: read
    needs: [deploy-argo]
    uses: kartverket/smia-apps/.github/workflows/run-nibas-cypress-job.yml@be0f98aa389ba65196fc838e34b8eba98fd36f8f # main
