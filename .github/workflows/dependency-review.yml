name: 'Dependency Review and Graph'
on:
  merge_group:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v6

      - name: 'Setup Java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v5
        continue-on-error: true
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}

      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v4.9.0
        env:
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}
        continue-on-error: true
        if: github.event_name == 'pull_request'
        with:
          comment-summary-in-pr: always
          fail-on-severity: high
          fail-on-scopes: runtime
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only, SSPL-1.0
          allow-dependencies-licenses: pkg:maven/org.eclipse.angus/angus-mail@2.0.3
