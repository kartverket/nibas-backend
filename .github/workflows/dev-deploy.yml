name: nibas-backend-dev-deploy
on: workflow_dispatch

env:
  image_name: nibas-backend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read

    outputs:
      image_tag: ${{ steps.setOutput.outputs.image_tag }}

    steps:
      - uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Europe/Oslo"
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build --info
        env:
          GH_USERNAME: ${{ secrets.PAT_USERNAME }}
          PAT: ${{ secrets.PAT_SCOPE_READ_PACKAGE }}

      - name: Determine image version hash
        id: git_hash
        run: echo "git_hash=$(git rev-parse --short $GITHUB_SHA)" >> $GITHUB_OUTPUT

      - name: Login to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build docker and push
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.registry }}/${{ github.repository }}:${{ github.ref_name }}-${{ steps.git_hash.outputs.git_hash }}
          build-args: |
            project_version_arg=${{ github.ref_name }}

      - name: Set output with build values
        id: setOutput
        run: |
          echo "image_tag=${{ github.ref_name }}-${{ steps.git_hash.outputs.git_hash }}" >> $GITHUB_OUTPUT

  deploy-argo:
    needs: build
    uses: kartverket/smia-apps/.github/workflows/release-app.yml@main
    with:
      application: nibas-backend
      version: ${{ needs.build.outputs.image_tag }}
      deploy_dev: true
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_ARGOCD }}
