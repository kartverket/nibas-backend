name: Deploy branch to dev
on: workflow_dispatch

env:
  image_name: nibas-backend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read
      issues: read
      checks: write
      pull-requests: write
    uses: kartverket/nibas-backend/.github/workflows/build-app.yml@main
    with:
      deploy_ghcr: true
    secrets: inherit

  deploy-argo:
    permissions:
      id-token: write
    needs: build
    uses: kartverket/smia-apps/.github/workflows/release-app-octo-sts.yml@main
    with:
      application: nibas-backend
      version: ${{ needs.build.outputs.version }}
      deploy_dev: true
      identity: nibas

  run-cypress:
    permissions:
      id-token: write
    needs: deploy-argo
    uses: kartverket/smia-apps/.github/workflows/run-nibas-cypress-job.yml@main
    with:
      identity: nibas
