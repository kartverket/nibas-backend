name: Deploy branch to dev
on: workflow_dispatch

env:
  image_name: nibas-backend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read
    uses: kartverket/nibas-backend/.github/workflows/build-app.yml
    with:
      deploy_ghcr: true
    secrets: inherit

  deploy-argo:
    needs: build
    uses: kartverket/smia-apps/.github/workflows/release-app.yml@main
    with:
      application: nibas-backend
      version: ${{ needs.build.outputs.version }}
      deploy_dev: true
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_ARGOCD }}
