name: Deploy branch to dev
on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
      packages: write
      checks: write
      pull-requests: write
    uses: $/.github/workflows/build-app.yml
    with:
      deploy_ghcr: true
    secrets:
      GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}

  deploy-dev:
    permissions:
      id-token: write
      contents: read
    needs: build
    uses: kartverket/smia-workflows/.github/workflows/deploy-app.yml@main
    with:
      application: nibas-backend
      version: ${{ needs.build.outputs.version }}
      digest: ${{ needs.build.outputs.digest }}
      environment: dev
      namespace: nibas-main
      identity: nibas
