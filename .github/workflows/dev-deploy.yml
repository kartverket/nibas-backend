name: nibas-backend-dev-deploy
on: workflow_dispatch

env:
  image_name: nibas-backend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read

    outputs:
      image_tag: ${{ steps.setOutput.outputs.image_tag }}

    steps:
      - uses: szenius/set-timezone@v1.1
        with:
          timezoneLinux: "Europe/Oslo"
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build --info
        env:
          GH_USERNAME: ${{ secrets.PAT_USERNAME }}
          PAT: ${{ secrets.PAT_SCOPE_READ_PACKAGE }}

      - name: Determine image version hash
        id: git_hash
        run: echo "git_hash=$(git rev-parse --short $GITHUB_SHA)" >> $GITHUB_OUTPUT

      - name: Login to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build docker and push
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.registry }}/${{ github.repository }}:${{ github.ref_name }}-${{ steps.git_hash.outputs.git_hash }}
          build-args: |
            project_version_arg=${{ github.ref_name }}

      - name: Set output with build values
        id: setOutput
        run: |
          echo "image_tag=${{ github.ref_name }}-${{ steps.git_hash.outputs.git_hash }}" >> $GITHUB_OUTPUT

  set-variables:
    runs-on: ubuntu-latest
    outputs:
      dev_auth_project_number: ${{ steps.set-dev-variables.outputs.dev_auth_project_number }}
      dev_service_account: ${{ steps.set-dev-variables.outputs.dev_service_account }}
    steps:
      - name: Set dev variables
        id: set-dev-variables
        run: |
          echo "dev_auth_project_number=747318126147" >> $GITHUB_OUTPUT
          echo "dev_service_account=nibas-deploy@nibas-dev-075c.iam.gserviceaccount.com" >> $GITHUB_OUTPUT

  deploy-dev:
    needs: [build, set-variables]
    name: Deploy to dev
    permissions:
      id-token: write
      pull-requests: write
      contents: read
      packages: write
    uses: kartverket/github-workflows/.github/workflows/run-terraform.yml@v3.1.3
    with:
      runner: atkv1-dev
      environment: dev
      kubernetes_cluster: atkv1-dev
      terraform_workspace: dev
      terraform_option_1: -var-file=variables/dev.tfvars
      terraform_option_2: -var=image=ghcr.io/kartverket/nibas-backend:${{ needs.build.outputs.image_tag }}
      terraform_init_option_1: -backend-config=backend/dev.gcs.tfbackend
      working_directory: terraform
      auth_project_number: ${{ needs.set-variables.outputs.dev_auth_project_number}}
      service_account: ${{ needs.set-variables.outputs.dev_service_account}}
      vault_role: nibas-backend-write-role
      project_id: kubernetes-dev-94b9
      deploy_on: ${{ github.ref }}
