name: Deploy branch to dev
on: workflow_dispatch

env:
  image_name: nibas-backend
  registry: ghcr.io
  registry_path: kartverket

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
      packages: write
      checks: write
      pull-requests: write
    uses: ./.github/workflows/build-app.yml
    with:
      deploy_ghcr: true
    secrets:
      SHARED_PACKAGES_READ_TOKEN: ${{ secrets.SHARED_PACKAGES_READ_TOKEN }}

  deploy-argo:
    permissions:
      id-token: write
      contents: read
    needs: build
    uses: kartverket/smia-apps/.github/workflows/release-app-octo-sts.yml@be0f98aa389ba65196fc838e34b8eba98fd36f8f # main
    with:
      application: nibas-backend
      version: ${{ needs.build.outputs.version }}
      deploy_dev: true
      identity: nibas
