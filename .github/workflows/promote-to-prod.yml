name: Promote test to prod
on: workflow_dispatch

env:
  image_name: nibas-backend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  deploy-argo:
    permissions:
      id-token: write
    uses: kartverket/smia-apps/.github/workflows/promote-app-octo-sts.yml@main
    with:
      application: nibas-backend
      identity: nibas
