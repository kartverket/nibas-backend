name: Promote test to prod
on: workflow_dispatch

env:
  image_name: nibas-backend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  deploy-argo:
    uses: kartverket/smia-apps/.github/workflows/promote-app.yml@main
    with:
      application: nibas-backend
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_ARGOCD }}
