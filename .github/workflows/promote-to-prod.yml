name: Promote test to prod
on: workflow_dispatch

env:
  image_name: nibas-backend
  registry: ghcr.io
  registry_path: kartverket

permissions:
  contents: read

jobs:
  deploy-argo:
    permissions:
      id-token: write
      contents: read
    uses: kartverket/smia-apps/.github/workflows/promote-app-octo-sts.yml@be0f98aa389ba65196fc838e34b8eba98fd36f8f # main
    with:
      application: nibas-backend
      identity: nibas
