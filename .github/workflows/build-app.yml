name: Build app
on:
  merge_group:
  pull_request:
    branches: [ main ]
  workflow_call:
    inputs:
      deploy_ghcr:
        description: "Deploy to ghcr?"
        default: false
        type: boolean
    secrets:
      GH_PACKAGES_PAT:
        description: "Read token for the private Maven package"
        required: true
    outputs:
      version:
        description: "The version of the docker-image created"
        value: ${{ jobs.publish.outputs.new_tag }}
      image_url:
        description: "The full URL to the docker-image created"
        value: ${{ jobs.publish.outputs.image_url }}
      digest:
        description: "The digest of the docker-image created"
        value: ${{ jobs.publish.outputs.digest }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Set local timezone
        run: sudo timedatectl set-timezone "Europe/Oslo"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build
        env:
          JAVA_TOOL_OPTIONS: "-Duser.timezone=Europe/Oslo"
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        if: always()
        with:
          files: |
            build/test-results/test/TEST-*.xml
            build/test-results/integrationTest/TEST-*.xml

  publish:
    if: inputs.deploy_ghcr
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      image_url: ${{ steps.set-output.outputs.image_url }}
      digest: ${{ steps.build-image.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Build application artifact
        run: ./gradlew assemble
        env:
          JAVA_TOOL_OPTIONS: "-Duser.timezone=Europe/Oslo"
          GH_PACKAGES_PAT: ${{ secrets.GH_PACKAGES_PAT }}

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ github.token }}
          release_branches: .*

      - name: Login to Github Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build docker and push
        id: build-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag_version.outputs.new_tag }},ghcr.io/${{ github.repository }}:latest
          build-args: |
            project_version_arg=${{ steps.tag_version.outputs.new_tag }}

      - name: Set output with build values
        id: set-output
        env:
          IMAGE_URL: ghcr.io/${{ github.repository }}@${{ steps.build-image.outputs.digest }}
        run: echo "image_url=$IMAGE_URL" >> "$GITHUB_OUTPUT"
