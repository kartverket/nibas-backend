name: Dependabot auto-merge
on: pull_request_target

jobs:
  auto-merge-dependabot:
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v4
      - uses: octo-sts/action@6177b4481c00308b3839969c3eca88c96a91775f # v1.0.0
        id: octo-sts
        with:
          scope: ${{ github.repository }}
          identity: auto-update
      - name: Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v2
      - name: Semver merge check
        id: semver-merge-check
        uses: actions/github-script@v7
        env:
          UPDATE_TYPE: ${{steps.dependabot-metadata.outputs.update-type}}
        with:
          script: |
            const UPDATE_TYPE = process.env.UPDATE_TYPE;
            console.log({ UPDATE_TYPE });
            
            const mergeRules = {
              'version-update:semver-major': false,
              'version-update:semver-minor': false,
              'version-update:semver-patch': true,
            };
            
            const shouldMerge = mergeRules[UPDATE_TYPE] || false;
            
            console.log({ shouldMerge });
            return shouldMerge;

      - name: Wait for Build Workflow to Complete
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullRequestBranch = context.payload.pull_request.head.ref;

            let isBuildRunning = true;
            let buildRun;

            while (isBuildRunning) {
              const { data: runs } = await github.actions.listWorkflowRunsForRepo({
                owner: owner,
                repo: repo,
                branch: pullRequestBranch,
                status: 'in_progress',
                event: 'pull_request',
                per_page: 10
              });

              buildRun = runs.workflow_runs.find(run => run.name === 'build');

              if (buildRun && buildRun.status === 'completed') {
                isBuildRunning = false;
                if (buildRun.conclusion !== 'success') {
                  throw new Error('Build failed. Aborting merge.');
                }
              } else {
                console.log('Waiting for build to complete...');
                await new Promise(resolve => setTimeout(resolve, 60000)); // Wait 1 minute before checking again
              }
            }

            console.log('Build completed successfully.');

      - name: Enable auto-merge for Dependabot PRs
        if: ${{fromJSON(steps.semver-merge-check.outputs.result)}}
        run: |
          gh pr review --approve -b "Dependency update type ${UPDATE_TYPE} matches auto-merge configuration, merging" "$PR_URL"
          gh pr merge --squash --admin "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
