name: Release PR
on:
  workflow_dispatch:
    inputs:
      branch-name:
        description: "Will be 'nibas-{branch-name}' in the environment. Must be a valid hostname label. If not provided, the current branch's name will be used."
        required: false
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
    branches:
      - main

concurrency:
  group: feature-env-${{ github.head_ref }}
  cancel-in-progress: true

env:
  image_name: nibas-backend
  registry: ghcr.io
  registry_path: kartverket

permissions:
  contents: read

jobs:
  should-create-feature-env:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/check-changes.yml
    with:
      ignore-paths: "README.md,.github/,.vscode/,.security/,docs/"

  determine-branch-name-pr:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.should-create-feature-env.outputs.has-relevant-changes == 'true' }}
    needs: should-create-feature-env
    name: Determine Branch Name (PR)
    runs-on: ubuntu-latest
    outputs:
      BRANCH_NAME: ${{ steps.determine-branch.outputs.branch_name_output }}
    steps:
      - name: Determine branch name
        id: determine-branch
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          BRANCH_NAME=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]')
          if [[ ! "$BRANCH_NAME" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "Branch name is not a valid hostname label"
            exit 1
          fi
          echo "branch_name_output=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

  determine-branch-name-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Determine Branch Name (Manual)
    runs-on: ubuntu-latest
    outputs:
      BRANCH_NAME: ${{ steps.determine-branch.outputs.branch_name_output }}
    steps:
      - name: Determine branch name
        id: determine-branch
        env:
          INPUT_BRANCH_NAME: ${{ inputs.branch-name }}
          DEFAULT_BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [ "$INPUT_BRANCH_NAME" != "" ]; then
            BRANCH_NAME="$INPUT_BRANCH_NAME"
          else
            BRANCH_NAME="$DEFAULT_BRANCH_NAME"
          fi
          BRANCH_NAME=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]')
          if [[ ! "$BRANCH_NAME" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "Branch name is not a valid hostname label"
            exit 1
          fi
          echo "branch_name_output=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

  validate-branch-name-pr:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.should-create-feature-env.outputs.has-relevant-changes == 'true' }}
    needs: [should-create-feature-env, determine-branch-name-pr]
    runs-on: ubuntu-latest
    name: Validate branch-name input (PR)
    outputs:
      valid: ${{ steps.validate.outputs.valid }}
    steps:
      - name: Validate branch-name is valid hostname label
        id: validate
        env:
          DETERMINED_BRANCH_NAME: ${{ needs.determine-branch-name-pr.outputs.BRANCH_NAME }}
        run: |
          if [[ ! "$DETERMINED_BRANCH_NAME" =~ ^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?$ ]]; then
            echo "Branch name is not a valid hostname label"
            echo "valid=false" >> $GITHUB_OUTPUT
          else
            echo "Branch name is a valid hostname label"
            echo "valid=true" >> $GITHUB_OUTPUT
          fi

  validate-branch-name-manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: determine-branch-name-manual
    runs-on: ubuntu-latest
    name: Validate branch-name input (Manual)
    outputs:
      valid: ${{ steps.validate.outputs.valid }}
    steps:
      - name: Validate branch-name is valid hostname label
        id: validate
        env:
          DETERMINED_BRANCH_NAME: ${{ needs.determine-branch-name-manual.outputs.BRANCH_NAME }}
        run: |
          if [[ ! "$DETERMINED_BRANCH_NAME" =~ ^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?$ ]]; then
            echo "Branch name is not a valid hostname label"
            echo "valid=false" >> $GITHUB_OUTPUT
          else
            echo "Branch name is a valid hostname label"
            echo "valid=true" >> $GITHUB_OUTPUT
          fi

  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
        contents: write
        packages: write
        checks: write
        pull-requests: write
    uses: ./.github/workflows/build-app.yml
    with:
      deploy_ghcr: true
    secrets:
      SHARED_PACKAGES_READ_TOKEN: ${{ secrets.SHARED_PACKAGES_READ_TOKEN }}

  pharos:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    needs: [build]
    name: Run Pharos security scan
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: "Run Pharos"
        uses: kartverket/pharos@446d11f033ffe30b4c91f885c3ad34ea3d8c6af7 # v0.7.0
        with:
          allow_severity_level: critical
          image_url: ${{ needs.build.outputs.image_url }}

  deploy-pull-request-pr:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.should-create-feature-env.outputs.has-relevant-changes == 'true' && needs.validate-branch-name-pr.outputs.valid == 'true' }}
    needs: [should-create-feature-env, validate-branch-name-pr, determine-branch-name-pr, build, pharos]
    name: Deploy Pull Request (PR)
    permissions:
      id-token: write
      contents: read
    uses: kartverket/smia-apps/.github/workflows/release-feature-branch.yml@be0f98aa389ba65196fc838e34b8eba98fd36f8f # main
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
    with:
      branch-name: ${{ needs.determine-branch-name-pr.outputs.BRANCH_NAME }}
      application: nibas-backend
      version: ${{ needs.build.outputs.version }}
      digest: ${{ needs.build.outputs.digest }}
      identity: nibas

  deploy-pull-request-manual:
    if: ${{ github.event_name == 'workflow_dispatch' && needs.validate-branch-name-manual.outputs.valid == 'true' }}
    needs: [validate-branch-name-manual, determine-branch-name-manual, build, pharos]
    name: Deploy Pull Request (Manual)
    permissions:
      id-token: write
      contents: read
    uses: kartverket/smia-apps/.github/workflows/release-feature-branch.yml@be0f98aa389ba65196fc838e34b8eba98fd36f8f # main
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
    with:
      branch-name: ${{ needs.determine-branch-name-manual.outputs.BRANCH_NAME }}
      application: nibas-backend
      version: ${{ needs.build.outputs.version }}
      digest: ${{ needs.build.outputs.digest }}
      identity: nibas

  post-deployed-message-pr:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.should-create-feature-env.outputs.has-relevant-changes == 'true' && needs.validate-branch-name-pr.outputs.valid == 'true' }}
    needs: [should-create-feature-env, validate-branch-name-pr, determine-branch-name-pr, deploy-pull-request-pr]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post deployment comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🚀 Feature branch was successfully deployed!

