name: Release PR
on:
  push:
    branches:
      - '*'

env:
  image_name: nibas-backend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    permissions:
        contents: write
        packages: write
        security-events: write
        actions: read
        issues: read
        checks: write
        pull-requests: write
    uses: kartverket/nibas-backend/.github/workflows/build-app.yml@main
    with:
      deploy_ghcr: true
    secrets: inherit

  pharos:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    needs: [build]
    name: Run Pharos security scan
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: "Run Pharos"
        uses: kartverket/pharos@v0.7.0
        with:
          allow_severity_level: critical
          image_url: ${{ needs.build.outputs.image_url }}
