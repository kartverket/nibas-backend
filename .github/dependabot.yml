version: 2
registries:
  maven-matrikkel:
    type: maven-repository
    url: https://maven.pkg.github.com/kartverket/matrikkelapi-v1-wsclient
    username: x-access-token
    password: ${{ secrets.GH_PACKAGES_PAT }}

updates:
  # Sjekker også oppdateringer på GitHub Maven Package aut-lib
  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - maven-matrikkel
    schedule:
      interval: weekly
      day: monday
      time: "02:23"
      timezone: "Europe/Oslo"

  - package-ecosystem: "gradle"
    directory: "/gradle"
    schedule:
      interval: weekly
      day: monday
      time: "02:23"
      timezone: "Europe/Oslo"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:23"
      timezone: "Europe/Oslo"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:23"
      timezone: "Europe/Oslo"

  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: weekly
      day: monday
      time: "02:23"
      timezone: "Europe/Oslo"
