version: 2
registries:
  maven-github:
    type: maven-repository
    url: https://maven.pkg.github.com/kartverket
    username: ${{ secrets.PAT_USERNAME }}
    password: ${{ secrets.PAT_SCOPE_READ_PACKAGE }}
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: daily

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily

  # Sjekker oppdateringer på GitHub Package aut-lib
  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - maven-github
    schedule:
      interval: daily
