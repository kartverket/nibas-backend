version: 2
registries:
  docker-hardened-images:
    type: docker-registry
    url: dhi.io
    username: ${{ secrets.DOCKERHUB_USERNAME }}
    password: ${{ secrets.DOCKERHUB_TOKEN }}

updates:
  # Sjekker også oppdateringer på GitHub Maven Package aut-lib
  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - maven-matrikkel
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "org.jetbrains.kotlin*"
    schedule:
      interval: weekly
      day: monday
      time: "02:23"
      timezone: "Europe/Oslo"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:23"
      timezone: "Europe/Oslo"

  - package-ecosystem: "docker"
    directory: "/"
    registries:
      - "docker-hardened-images"
    schedule:
      interval: weekly
      day: monday
      time: "02:23"
      timezone: "Europe/Oslo"

