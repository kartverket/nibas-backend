version: 2
registries:
  maven-github:
    type: maven-repository
    url: https://maven.pkg.github.com/kartverket
updates:
  # Sjekker også oppdateringer på GitHub Maven Package aut-lib
  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - maven-github
    schedule:
      interval: daily

  - package-ecosystem: "gradle"
    directory: "/gradle"
    schedule:
      interval: daily

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: daily

  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: daily
