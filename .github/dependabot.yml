version: 2
registries:
  maven-central:
    type: maven-repository
    url: https://repo.maven.apache.org/maven2
  maven-matrikkel:
    type: maven-repository
    url: https://maven.pkg.github.com/kartverket/matrikkelapi-v1-wsclient
    username: x-access-token
    password: ${{ secrets.GH_PACKAGES_PAT }}
  docker-hardened-images:
    type: docker-registry
    url: dhi.io
    username: ${{ secrets.DOCKERHUB_USERNAME }}
    password: ${{ secrets.DOCKERHUB_TOKEN }}

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - maven-central
      - maven-matrikkel
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "org.jetbrains.kotlin*"
    schedule:
      interval: weekly
      day: monday
      time: "02:23"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 30
      semver-patch-days: 30
      include:
        - "org.jetbrains.kotlin*"

  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
    schedule:
      interval: weekly
      day: monday
      time: "02:23"
      timezone: "Europe/Oslo"

  - package-ecosystem: "docker"
    directory: "/"
    registries:
      - "docker-hardened-images"
    schedule:
      interval: weekly
      day: monday
      time: "02:23"
      timezone: "Europe/Oslo"
